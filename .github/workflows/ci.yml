name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/convene_test
      AUTH_SECRET: test-secret-test-secret-test-secret-test
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      CRON_SECRET: test-cron-secret
      RESEND_API_KEY: test
      ANTHROPIC_API_KEY: test
      MAPBOX_TOKEN: test
      NEXT_PUBLIC_MAPBOX_TOKEN: test
      R2_ACCOUNT_ID: test
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test
      R2_BUCKET: convene
      R2_PUBLIC_URL: https://example.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --no-audit --no-fund

      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Apply pgvector + embedding column
        run: psql "$DATABASE_URL" -f prisma/migrations/manual/001_pgvector_event_embedding.sql || true

      - name: Seed
        run: npm run prisma:seed

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test
